name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run setup:local
      - run: npm run build
      - name: Authentication and booking integration checks
        timeout-minutes: 3
        run: |
          npm start > /tmp/aria-worker.log 2>&1 &
          aria_pid=$!
          trap 'kill "$aria_pid" 2>/dev/null || true' EXIT
          node scripts/wait-for-local.mjs
          node scripts/auth-smoke-test.mjs
          node scripts/smoke-test.mjs
